name: DevOps App CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout devops-app
        uses: actions/checkout@v6

      - name: Checkout company-common-lib
        uses: actions/checkout@v6
        with:
          repository: avi6650/company-common-lib
          path: company-common-lib

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Publish internal library
        working-directory: company-common-lib
        run: ./gradlew publish

      - name: Build and test devops-app
        env:
          INTERNAL_REPO_URL: ${{ github.workspace }}/company-common-lib/lib/build/internal-repo
        run: ./gradlew clean build

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/

      - name: Upload application JAR
        uses: actions/upload-artifact@v4
        with:
          name: devops-app-jar
          path: build/libs/*.jar

  package:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v5
        with:
          name: devops-app-jar
          path: artifact

      - name: Verify JAR
        run: ls -lh artifact/
