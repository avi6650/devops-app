name: DevOps App CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout devops-app
        uses: actions/checkout@v6

      - name: Checkout company-common-lib
        uses: actions/checkout@v6
        with:
          repository: avi6650/company-common-lib
          path: company-common-lib

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Publish internal library
        working-directory: company-common-lib
        run: ./gradlew publish

      - name: Build, test, and generate coverage
        env:
          INTERNAL_REPO_URL: ${{ github.workspace }}/company-common-lib/lib/build/internal-repo
        run: ./gradlew clean build jacocoTestReport

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/html/

      - name: SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          INTERNAL_REPO_URL: ${{ github.workspace }}/company-common-lib/lib/build/internal-repo
        run: ./gradlew sonar

      # - name: OWASP Dependency Check
      #   env:
      #     NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      #     INTERNAL_REPO_URL: ${{ github.workspace }}/company-common-lib/lib/build/internal-repo
      #   run: ./gradlew dependencyCheckAnalyze --rerun-tasks

      # - name: Upload OWASP report
      #   if: always()
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: owasp-report
      #     path: build/reports/dependency-check-report.html

      - name: Upload application JAR
        uses: actions/upload-artifact@v4
        with:
          name: devops-app-jar
          path: build/libs/*.jar

  package:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v5
        with:
          name: devops-app-jar
          path: artifact

      - name: Verify JAR
        run: ls -lh artifact/

  docker:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout devops-app
        uses: actions/checkout@v6

      - name: Download application JAR
        uses: actions/download-artifact@v5
        with:
          name: devops-app-jar
          path: build/libs

      - name: Build Docker image
        run: docker build -t devops-app:${{ github.sha }} .

      - name: Verify Docker image
        run: docker images devops-app
