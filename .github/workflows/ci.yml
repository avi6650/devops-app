name: DevOps App CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout devops-app
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build, test, and generate coverage
        run: ./gradlew clean build jacocoTestReport

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/html/

      - name: SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar

      # Temporarily disabled while we continue building the pipeline.
      # - name: OWASP Dependency Check
      #   env:
      #     NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      #   run: ./gradlew dependencyCheckAnalyze --rerun-tasks

      # - name: Upload OWASP report
      #   if: always()
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: owasp-report
      #     path: build/reports/dependency-check-report.html

      - name: Upload application JAR
        uses: actions/upload-artifact@v4
        with:
          name: devops-app-jar
          path: build/libs/*.jar

  package:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v5
        with:
          name: devops-app-jar
          path: artifact

      - name: Verify JAR
        run: ls -lh artifact/

  docker:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout devops-app
        uses: actions/checkout@v6

      - name: Download application JAR
        uses: actions/download-artifact@v5
        with:
          name: devops-app-jar
          path: build/libs

      - name: Build Docker image
        run: docker build -t devops-app:${{ github.sha }} .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'devops-app:${{ github.sha }}'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

      - name: Verify Docker image
        run: docker images devops-app

      - name: Debug GitHub OIDC claims
        uses: github/actions-oidc-debugger@main
        with:
          audience: sts.amazonaws.com
          
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::263425943161:role/devops-app-github-actions
          aws-region: ca-central-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity