apiVersion: apps/v1
kind: Deployment

metadata:
  name: devops-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: devops-app

  template:
    metadata:
      labels:
        app: devops-app

    spec:
      containers:
        - name: devops-app
          image: 263425943161.dkr.ecr.ca-central-1.amazonaws.com/devops-app:0d057afbb5934e25bbabcb4687b9422529b1c4fe

          ports:
            - containerPort: 8080

          envFrom:
            - configMapRef:
                name: devops-app-config

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
