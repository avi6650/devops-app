plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.devopsproject'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

def internalRepoUrl = providers.gradleProperty("internalRepoUrl")
        .orElse(providers.environmentVariable("INTERNAL_REPO_URL"))
        .getOrElse(null)

if (!internalRepoUrl) {
    throw new GradleException(
            "Internal repository URL is missing. " +
            "Set internalRepoUrl in Gradle properties or INTERNAL_REPO_URL."
    )
}

repositories {
    maven {
        url = uri(internalRepoUrl)
    }

    mavenCentral()
}

dependencies {
    implementation 'com.devopsproject:company-common-lib:1.0.0'

	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
